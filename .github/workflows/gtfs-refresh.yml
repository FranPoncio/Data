name: Actualizar datos GTFS

# Se dispara a mano desde la pestaña Actions ("Run workflow").
# Descarga los feeds GTFS configurados en scripts/gtfs-sources.json
# (incluidos los remotos con URL), regenera assets/data/transporte-gtfs.json
# y lo commitea. Ideal para sumar colectivos y otras ciudades sin tocar nada
# a mano.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gtfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencia para zips remotos
        run: npm install fflate --no-save

      - name: Generar datos GTFS
        run: node scripts/build-gtfs.mjs

      - name: Commitear cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/transporte-gtfs.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos GTFS."
          else
            git commit -m "Actualizar datos GTFS (automático)"
            git push
          fi
