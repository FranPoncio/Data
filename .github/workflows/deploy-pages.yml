name: Deploy a GitHub Pages

# Publica el sitio estático en GitHub Pages en cada push a main.
# `configure-pages` con enablement:true habilita Pages automáticamente
# la primera vez, sin tener que tocar Settings a mano.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages (y habilitarlo si hace falta)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
