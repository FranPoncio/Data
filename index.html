<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutas Argentinas · Viajá a los mejores puntos turísticos</title>
  <meta name="description" content="Planificá viajes a los puntos más turísticos de Argentina con las mejores rutas según tu ubicación y medio de transporte." />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ======================= PANEL LATERAL ======================= -->
    <aside id="panel">
      <header class="panel-header">
        <div class="brand">
          <span class="brand-sun">☀</span>
          <div>
            <h1>Rutas Argentinas</h1>
            <p>Viajá a los mejores puntos turísticos del país</p>
          </div>
        </div>
      </header>

      <div class="panel-body">
        <!-- 1) DESTINO -->
        <section class="block">
          <h2><span class="step">1</span> ¿A dónde vas?</h2>
          <label class="field">
            <span>Localidad / punto turístico</span>
            <select id="sel-localidad"></select>
          </label>
          <label class="field">
            <span>Destino específico</span>
            <select id="sel-destino"></select>
          </label>
        </section>

        <!-- 2) MODO -->
        <section class="block">
          <h2><span class="step">2</span> ¿Cómo viajás?</h2>
          <div id="modos" class="modos"></div>
        </section>

        <!-- 3) ORIGEN -->
        <section class="block">
          <h2><span class="step">3</span> ¿Desde dónde salís?</h2>
          <button id="btn-ubicacion" class="btn btn-ghost">📍 Usar mi ubicación</button>
          <p class="hint" id="origen-estado">O hacé clic en el mapa para marcar tu punto de salida.</p>
        </section>

        <button id="btn-crear" class="btn btn-primary btn-block" disabled>
          Crear rutas
        </button>

        <!-- RESULTADOS -->
        <section id="resultados" class="block resultados hidden">
          <h2>Rutas sugeridas</h2>
          <p class="hint" id="resultados-hint"></p>
          <div id="lista-rutas"></div>
        </section>

        <footer class="panel-footer">
          <p>Mapa © OpenStreetMap · CARTO &nbsp;|&nbsp; Ruteo © Valhalla / OSM</p>
        </footer>
      </div>
    </aside>

    <!-- ======================= MAPA ======================= -->
    <main id="map"></main>

    <!-- Overlay de carga -->
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <span id="loader-text">Calculando rutas…</span>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
