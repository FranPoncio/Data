  <text x="40" y="516" font-size="11.5" fill="#cbd5e1">El proyecto avanza al 61% con leve atraso (SPI 0,97) y sobrecosto acumulado (CPI 0,92). Al ritmo actual se</text>
  <text x="40" y="532" font-size="11.5" fill="#cbd5e1">estima un costo final de $8,7 M (+4,8% sobre presupuesto). El paquete "Tendido de caños" concentra el riesgo.</text>
