<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" fill="#f1f5f9"/>
  <!-- Header -->
  <rect x="0" y="0" width="960" height="66" fill="#1e293b"/>
  <text x="28" y="42" font-size="22" font-weight="700" fill="#f8fafc">📈 Informe de Ventas 2025</text>
  <text x="820" y="30" font-size="12" fill="#94a3b8">Actualizado: 03/08</text>
  <rect x="806" y="40" width="128" height="16" rx="8" fill="#334155"/><text x="870" y="52" text-anchor="middle" font-size="10" fill="#cbd5e1">Filtro: Región ▾</text>

  <!-- KPI cards -->
  <g>
    <rect x="24" y="86" width="216" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="40" y="112" font-size="12" fill="#64748b">Ventas totales</text>
    <text x="40" y="146" font-size="28" font-weight="700" fill="#0f172a">$ 4,82 M</text>
    <text x="40" y="168" font-size="12" fill="#16a34a">▲ 12,4% vs 2024</text>
  </g>
  <g>
    <rect x="256" y="86" width="216" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="272" y="112" font-size="12" fill="#64748b">Margen bruto</text>
    <text x="272" y="146" font-size="28" font-weight="700" fill="#0f172a">38,6 %</text>
    <text x="272" y="168" font-size="12" fill="#16a34a">▲ 1,8 pp</text>
  </g>
  <g>
    <rect x="488" y="86" width="216" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="504" y="112" font-size="12" fill="#64748b">Ticket promedio</text>
    <text x="504" y="146" font-size="28" font-weight="700" fill="#0f172a">$ 18.240</text>
    <text x="504" y="168" font-size="12" fill="#dc2626">▼ 3,1%</text>
  </g>
  <g>
    <rect x="720" y="86" width="216" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="736" y="112" font-size="12" fill="#64748b"># Operaciones</text>
    <text x="736" y="146" font-size="28" font-weight="700" fill="#0f172a">26.410</text>
    <text x="736" y="168" font-size="12" fill="#16a34a">▲ 15,9%</text>
  </g>

  <!-- Line chart: Ventas por mes -->
  <rect x="24" y="196" width="560" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="222" font-size="14" font-weight="700" fill="#0f172a">Ventas por mes</text>
  <polyline points="52,380 100,360 148,368 196,330 244,340 292,300 340,312 388,270 436,288 484,250 532,262 560,240" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="52,395 100,388 148,392 196,372 244,380 292,360 340,366 388,344 436,352 484,330 532,338 560,326" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="48" y1="405" x2="562" y2="405" stroke="#e2e8f0"/>
  <g font-size="10" fill="#94a3b8"><text x="52" y="420">E</text><text x="148" y="420">M</text><text x="244" y="420">M</text><text x="340" y="420">J</text><text x="436" y="420">S</text><text x="532" y="420">N</text></g>
  <text x="410" y="222" font-size="11" fill="#2563eb">━ 2025</text><text x="470" y="222" font-size="11" fill="#94a3b8">┈ 2024</text>

  <!-- Bar chart: Top categorías -->
  <rect x="600" y="196" width="336" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="616" y="222" font-size="14" font-weight="700" fill="#0f172a">Top categorías</text>
  <g font-size="11" fill="#475569">
    <text x="616" y="256">Bebidas</text><rect x="700" y="246" width="210" height="14" rx="4" fill="#2563eb"/>
    <text x="616" y="286">Almacén</text><rect x="700" y="276" width="168" height="14" rx="4" fill="#3b82f6"/>
    <text x="616" y="316">Limpieza</text><rect x="700" y="306" width="132" height="14" rx="4" fill="#60a5fa"/>
    <text x="616" y="346">Lácteos</text><rect x="700" y="336" width="96" height="14" rx="4" fill="#93c5fd"/>
    <text x="616" y="376">Perfumería</text><rect x="700" y="366" width="64" height="14" rx="4" fill="#bfdbfe"/>
  </g>

  <!-- Map / table -->
  <rect x="24" y="444" width="440" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="470" font-size="14" font-weight="700" fill="#0f172a">Ventas por provincia (mapa)</text>
  <g fill="#3b82f6" opacity="0.85"><circle cx="140" cy="530" r="26"/><circle cx="240" cy="510" r="18"/><circle cx="320" cy="545" r="14"/><circle cx="400" cy="520" r="10"/></g>

  <rect x="480" y="444" width="456" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="496" y="470" font-size="14" font-weight="700" fill="#0f172a">Detalle por vendedor</text>
  <g font-size="11" fill="#475569">
    <line x1="496" y1="482" x2="920" y2="482" stroke="#e2e8f0"/>
    <text x="496" y="502">Vendedor</text><text x="720" y="502">Ventas</text><text x="850" y="502">%</text>
    <text x="496" y="524">M. Gómez</text><text x="720" y="524">$ 1,20 M</text><text x="850" y="524" fill="#16a34a">24,9%</text>
    <text x="496" y="546">L. Díaz</text><text x="720" y="546">$ 0,98 M</text><text x="850" y="546" fill="#16a34a">20,3%</text>
    <text x="496" y="568">R. Sosa</text><text x="720" y="568">$ 0,74 M</text><text x="850" y="568" fill="#dc2626">15,4%</text>
  </g>
</svg>
